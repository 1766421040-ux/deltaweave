name: Verify CPU contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m deltaweave demo --output /tmp/deltaweave-ci-demo --mode adaptive
      - run: python scripts/benchmark_domain.py --output /tmp/deltaweave-domain.json
      # CI performs no model download, remote inference or training.
