[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltaweave"
version = "0.1.0"
description = "Snapshot-consistent incremental knowledge tools, with local DeepSeek behavior experiments"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["packaging>=24.2,<27"]

[project.scripts]
deltaweave = "deltaweave.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
plots = ["matplotlib>=3.9,<4"]
model = ["torch>=2.6", "transformers>=4.57,<5", "peft>=0.17", "accelerate>=1.0", "safetensors>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
